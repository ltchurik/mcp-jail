name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Actions are pinned to commits (the tag is in the comment); dependabot
# proposes the bumps.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: "1.27" }
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with: { version: v2.15 }
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with: { go-version-input: "1.27", go-package: ./... }
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: "1.27" }
      - run: go test -race -cover ./...
  e2e-bwrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: "1.27" }
      - run: sudo apt-get install -y bubblewrap
      # Ubuntu 24.04 restricts unprivileged user namespaces by default.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: bwrap --unshare-user-try --unshare-net --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind-try /lib64 /lib64 --proc /proc --dev /dev -- /usr/bin/true
      - run: make build
      - run: ./scripts/e2e.sh
      - run: go test -count=1 -v -run TestRealServer ./internal/realtest
        env: { MCP_JAIL_E2E_REAL: 1 }
  e2e-sandbox-exec:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: "1.27" }
      - run: make build
      - run: ./scripts/e2e.sh
      - run: go test -count=1 -v -run TestRealServer ./internal/realtest
        env: { MCP_JAIL_E2E_REAL: 1 }
  e2e-appcontainer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: "1.27" }
      # What README asks a Windows user to do once, as administrator: let
      # packages stat the volume root and C:\Users (a realpath walks them).
      - run: icacls C:\ /grant "*S-1-15-2-1:(RA)"; icacls C:\Users /grant "*S-1-15-2-1:(RA)"
        shell: pwsh
      - run: go test -count=1 -v -run TestRealServer ./internal/realtest
        env: { MCP_JAIL_E2E_REAL: 1 }
